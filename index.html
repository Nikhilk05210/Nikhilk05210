<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portfolio Card</title>

<style>
    body {
        margin: 0;
        padding: 0;
        background: #f0f2f5;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: Arial, sans-serif;
    }

    .card {
        background: #fff;
        width: 330px;
        padding: 25px;
        border-radius: 20px;
        box-shadow: 0 5px 25px rgba(0,0,0,0.15);
        text-align: center;
    }

    .name {
        font-size: 26px;
        font-weight: bold;
        margin-bottom: 8px;
    }

    .role {
        font-size: 16px;
        color: #666;
        margin-bottom: 20px;
    }

    .links a {
        text-decoration: none;
        font-size: 22px;
        margin: 0 12px;
    }

    .github { color: #000; }
    .linkedin { color: #0A66C2; }
</style>
</head>

<body>

<div class="card">
    <div class="name">Nikhil Manginipalli</div>
    <div class="role">Aspiring IT Professional</div>

    <div class="links">
        <a class="github" href="https://github.com/YOUR_GITHUB" target="_blank">🐙</a>
        <a class="linkedin" href="https://linkedin.com/in/YOUR_LINKEDIN" target="_blank">🔗</a>
    </div>
</div>

</body>
</html>
